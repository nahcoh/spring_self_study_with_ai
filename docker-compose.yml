services:
  mysql:
    image: mysql:8.4
    container_name: mvc-crud-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: mvc_crud
      MYSQL_USER: mvc_user
      MYSQL_PASSWORD: mvc_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    container_name: mvc-crud-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/nahcoh/spring_self_study_with_ai:latest
    build: .
    container_name: mvc-crud-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/mvc_crud?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: mvc_user
      DB_PASSWORD: mvc_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data: