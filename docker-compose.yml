services:
  mysql:
    image: mysql:8.4
    container_name: mvc-crud-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: mvc_crud
      MYSQL_USER: mvc_user
      MYSQL_PASSWORD: mvc_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    container_name: mvc-crud-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: mvc-crud-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data: