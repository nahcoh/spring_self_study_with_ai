services:
  mysql:
    image: mysql:8.4
    container_name: mvc-crud-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: mvc_crud
      MYSQL_USER: mvc_user
      MYSQL_PASSWORD: mvc_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: mvc-crud-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data: