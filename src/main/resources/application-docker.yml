spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false

  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 10
        one-indexed-parameters: false

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PROT}
  cache:
    type: redis

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
